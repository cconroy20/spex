<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spectral Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>The Spectral Explorer</h1>
  <p class="sub">An exploratory tool for understanding the optical spectrum of stars.<br>
     Models were generated from ATLAS12/SYNTHE programs, which assume LTE and
     1D plane-parallel atmospheres.<br>
     Developed by Charlie Conroy and Claude.</p>
  <div id="stars" class="stars" role="radiogroup" aria-label="Star"></div>
</header>

<div id="controls">
  <div class="row">
    <button id="reset" title="Back to the wavelength range, resolution, flux range, species and display options this star opens with">Reset</button>
  </div>
  <canvas id="brush" height="54" title="drag the box edges to resize · drag inside it to pan · drag outside for a new range · double-click the plot to reset"></canvas>
  <div class="row">
    <label>Wavelength</label>
    <input class="wend" id="wlo" inputmode="decimal" spellcheck="false"
           title="click to type a wavelength">
    <div id="wrange" class="dual">
      <div class="track"></div>
      <div class="fill" id="wfill"></div>
      <div class="h" id="hlo"></div>
      <div class="h" id="hhi"></div>
    </div>
    <input class="wend" id="whi" inputmode="decimal" spellcheck="false"
           title="click to type a wavelength">
  </div>
  <div class="row">
    <label class="resctl">Resolution
      <input type="range" id="res" min="0" max="1000" step="1" value="1000">
    </label>
    <span class="hint" id="reslabel"></span>
  </div>
  <div class="row">
    <label>Flux range</label>
    <input class="wend" id="ylo" inputmode="decimal" spellcheck="false"
           title="click to type a value">
    <div id="yrange" class="dual">
      <div class="track"></div>
      <div class="fill" id="yfill"></div>
      <div class="h" id="yh0"></div>
      <div class="h" id="yh1"></div>
    </div>
    <input class="wend" id="yhi" inputmode="decimal" spellcheck="false"
           title="click to type a value">
    <span class="fsw">Top panel
      <button id="flam" class="seg on">F<sub>&lambda;</sub></button><button
              id="fnu" class="seg">F<sub>&nu;</sub></button>
      <button id="bb" class="seg lone" title="Planck function at the model's Teff, times pi, so it carries the same bolometric flux">blackbody</button>
    </span>
    <span class="fsw">Formation depth
      <button id="foff" class="seg fm on">off</button><button
              id="ftau" class="seg fm">log &tau;</button><button
              id="ftemp" class="seg fm">T</button>
    </span>
    <span class="fsw"><button id="tell" class="seg lone"
      title="ESO SkyCalc molecular transmission, airmass 1, 2.5 mm PWV">telluric</button></span>
  </div>
  <div class="row">
    <label class="resctl">S/N per pixel
      <input type="range" id="snr" min="0" max="100" step="1" value="100">
    </label>
    <span class="hint" id="snrlabel"></span>
    <span class="fsw">pixels per element
      <button class="seg pp" data-p="1">1</button><button
              class="seg pp" data-p="2">2</button><button
              class="seg pp on" data-p="3">3</button><button
              class="seg pp" data-p="4">4</button><button
              class="seg pp" data-p="5">5</button>
    </span>
    <button id="reseed" class="seg lone">resample noise</button>
  </div>
</div>

<div id="main">
  <aside id="sidebar">
    <div class="sbtools">
      <button id="mindiv" class="seg on">Individual</button>
      <button id="mcomb" class="seg"
              title="Approximate: treats overlapping lines as independent, which they are not.">Combined</button>
    </div>
    <div class="sbtools">
      <button id="toggleall">All</button>
      <button id="togglenone">None</button>
    </div>
    <div id="species"></div>
  </aside>
  <div id="plotwrap">
    <div id="plot"></div>
    <div id="lmark"></div>
    <div id="axiswrap"><canvas id="axis"></canvas></div>
  </div>
</div>
<div id="tip"></div>

<script src="app.js"></script>
</body>
</html>
