    <span class="stand">An exploratory tool for understanding the spectra of stars.</span>
    <button id="reset" class="ghost" title="Back to the wavelength range, resolution, flux range, species and display options this star opens with">Reset Parameters</button>
  </div>
  <div id="stars" class="stars" role="radiogroup" aria-label="Star"></div>
  <canvas id="brush" height="38" title="drag the box edges to resize · drag inside it to pan · drag outside for a new range · double-click the plot to reset"></canvas>
  <div class="row">
    <span class="ctl"><label for="wlo">Wavelength</label>
      <input class="wend" id="wlo" inputmode="decimal" spellcheck="false"
             title="click to type a wavelength">
      <div id="wrange" class="dual">
        <div class="track"></div><div class="fill" id="wfill"></div>
        <div class="h" id="hlo"></div><div class="h" id="hhi"></div>
      </div>
      <input class="wend" id="whi" inputmode="decimal" spellcheck="false"
             title="click to type a wavelength"></span>
    <span class="ctl"><label for="res">Resolution</label>
      <input type="range" id="res" min="0" max="1000" step="1" value="1000"
             title="Convolve the R = 300,000 synthesis down to a lower resolving power">
      <span class="hint" id="reslabel"></span></span>
  </div>
</div>

<div id="main">
  <aside id="sidebar">
    <section id="tsec" hidden>
      <h2>Sequence</h2>
      <div class="frow" id="tgheld"><label id="heldlabel"></label>
        <span class="segbar" id="heldbtns"></span></div>
      <div class="frow"><label for="teff" id="axlabel">T<sub>eff</sub></label>
        <span class="hint" id="tefflabel"></span></div>
      <input type="range" id="teff" min="0" max="1000" step="1" value="500"
             title="The one parameter this sequence varies. Everything else is held fixed">
    </section>

    <section id="spsec">
      <h2>Species</h2>
      <div class="sbtools">
        <button id="mindiv" class="seg on"
                title="One panel per selected species">Individual</button>
        <button id="mcomb" class="seg"
                title="Multiply the selected species into a single panel. Approximate: it treats overlapping lines as independent, which they are not.">Combined</button>
      </div>
      <div class="sbtools">
        <button id="toggleall" title="Show every species">All</button>
        <button id="togglenone" title="Hide every species">None</button>
      </div>
      <div id="species"></div>
    </section>

    <section>
      <h2>Display</h2>
      <div class="frow"><label for="ylo">Flux range</label>
        <span class="ctl">
          <input class="wend" id="ylo" inputmode="decimal" spellcheck="false"
                 title="click to type a value">
          <div id="yrange" class="dual">
            <div class="track"></div><div class="fill" id="yfill"></div>
            <div class="h" id="yh0"></div><div class="h" id="yh1"></div>
          </div>
          <input class="wend" id="yhi" inputmode="decimal" spellcheck="false"
                 title="click to type a value"></span></div>
      <div class="frow"><label>Top panel</label>
        <span class="segbar"><button id="flam" class="seg on"
                title="Plot the top panel as flux per unit wavelength">F<sub>&lambda;</sub></button><button
                id="fnu" class="seg"
                title="Plot the top panel as flux per unit frequency, which moves the peak">F<sub>&nu;</sub></button></span></div>
      <div class="frow"><label>Formation depth</label>
        <span class="segbar"><button id="foff" class="seg fm on"
                title="No formation-depth panel">off</button><button
                id="ftau" class="seg fm"
                title="Add a panel showing where each wavelength forms, as log tau at 5000 A">log &tau;</button><button
                id="ftemp" class="seg fm"
                title="Add a panel showing the temperature at which each wavelength forms">T</button></span></div>
      <div class="frow toggles">
        <button id="bb" class="seg lone" title="Overlay a blackbody on the top panel. The Planck function at the model's Teff, times pi, so it carries the same bolometric flux">blackbody</button>
        <button id="tell" class="seg lone" title="Add a panel displaying telluric absorption. ESO SkyCalc molecular transmission, airmass 1, 2.5 mm PWV">telluric</button>
      </div>
    </section>

    <section>
      <h2>Simulated observation</h2>
      <div class="frow"><label for="snr">S/N per pixel</label>
        <span class="hint" id="snrlabel"></span></div>
      <input type="range" id="snr" min="0" max="100" step="1" value="100"
             title="Add photon noise at this continuum signal-to-noise per pixel. Off at the right-hand end">
      <div class="frow"><label>pixels per element</label>
        <span class="segbar"><button class="seg pp" data-p="1"
                title="One detector pixel per resolution element">1</button><button
                class="seg pp" data-p="2"
                title="Two detector pixels per resolution element">2</button><button
                class="seg pp on" data-p="3"
                title="Three detector pixels per resolution element">3</button><button
                class="seg pp" data-p="4"
                title="Four detector pixels per resolution element">4</button><button
                class="seg pp" data-p="5"
                title="Five detector pixels per resolution element">5</button></span></div>
      <div class="frow toggles"><button id="reseed" class="seg lone"
                title="Draw a fresh noise realization at the same signal-to-noise">resample noise</button></div>
    </section>
  </aside>

  <div id="plotwrap">
    <div id="plot"></div>
    <div id="lmark"></div>
    <div id="axiswrap"><canvas id="axis"></canvas></div>
  </div>
</div>

<footer>
  <p>Models were generated from the ATLAS12 and SYNTHE programs, which assume LTE and
     1D plane-parallel atmospheres. Developed by Charlie Conroy and Claude.</p>
</footer>
